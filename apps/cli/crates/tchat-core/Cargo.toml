[package]
name = "tchat-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cliente HTTP, WebSocket y autenticación de TChat"

[package.metadata.dist]
dist = false

[dependencies]
chrono.workspace = true
futures-util = "0.3.34"
keyring = "3.6.3"
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "rustls",
    "http2",
    "charset",
] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
] }
tokio-tungstenite = { version = "0.30.0", features = [
    "rustls-tls-webpki-roots",
] }
url = "2.5.8"
uuid = { workspace = true, features = ["v4", "serde"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["linux-native-sync-persistent"] }
