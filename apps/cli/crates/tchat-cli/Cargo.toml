[package]
name = "tchat-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cliente de terminal de TChat"
repository = "https://github.com/ortisec/TChat"
authors = ["Jose Guillermo Ortiz Quispe"]

[package.metadata.dist]
dist = true

[package.metadata.wix]
upgrade-guid = "aa100a8e-3ee9-4110-9ff8-f20ceee29dab"
path-guid = "ee6b959c-5d72-4b50-9afb-60f32ef12ea5"
license = false
eula = false

[[bin]]
name = "tchat"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
tchat-core = { version = "0.1.0", path = "../tchat-core" }
tchat-tui = { version = "0.1.0", path = "../tchat-tui" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
webbrowser = "1.2.5"
