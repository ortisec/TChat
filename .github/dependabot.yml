version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /
      - /apps/www
      - /apps/account
      - /apps/download
      - /packages/ui
      - /packages/api-client
      - /packages/config
    schedule:
      interval: weekly
    groups:
      js:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /apps/cli
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /services/api
    schedule:
      interval: weekly
