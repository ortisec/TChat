name: tchat-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: tchat-postgres
    environment:
      POSTGRES_USER: tchat
      POSTGRES_PASSWORD: tchat
      POSTGRES_DB: tchat
    ports:
      - "5432:5432"
    volumes:
      - tchat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tchat -d tchat"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Opcional: pila completa en contenedores (`docker compose --profile full up`).
  api:
    profiles: ["full"]
    build:
      context: ../../services/api
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://tchat:tchat@postgres:5432/tchat
      CORS_ORIGINS: http://localhost:4321,http://localhost:4322,http://localhost:4323
      FIREBASE_PROJECT_ID: tchat-c20ce
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tchat_pgdata:
